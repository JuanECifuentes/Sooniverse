<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>
    <style>
        /* Modern email client hover states */
        .btn-email-primary {
            background: linear-gradient(135deg, #60EFFF 0%, #6366F1 50%, #8A2BE2 100%) !important;
            color: #FFFFFF !important;
            transition: transform 0.3s ease, box-shadow 0.3s ease !important;
        }
        .btn-email-primary:hover {
            transform: translateY(-2px) !important;
            box-shadow: 0 0 20px rgba(96, 239, 255, 0.6), 0 0 35px rgba(138, 43, 226, 0.4) !important;
        }
        .btn-email-secondary {
            border: 1.5px solid #60EFFF !important;
            color: #FFFFFF !important;
            transition: transform 0.3s ease, background-color 0.3s ease, box-shadow 0.3s ease !important;
        }
        .btn-email-secondary:hover {
            transform: translateY(-2px) !important;
            background-color: rgba(96, 239, 255, 0.12) !important;
            box-shadow: 0 0 16px rgba(96, 239, 255, 0.4) !important;
        }

        .text-cosmic {
            background: linear-gradient(135deg, #60EFFF 0%, #8A2BE2 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
    </style>
</head>
<body style="margin: 0; padding: 0; background-color: #070A12; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #94A3B8; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;">
    <table border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color: #070A12; table-layout: fixed; min-height: 100vh;">
        <tr>
            <td align="center" style="padding: 40px 10px;">
                <table border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color: #0F172A; border: 1px solid #1E293B; border-radius: 14px; overflow: hidden; max-width: 600px; box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.7);">
                    
                    <!-- HEADER -->
                    <tr>
                        <td align="center" style="padding: 36px 30px 26px 30px; border-bottom: 1px solid #1E293B; background-color: #0A101D;">
                            <span style="font-size: 32px; font-weight: 800; letter-spacing: -1.5px; text-decoration: none; display: inline-block;">
                                <span style="color: #FFFFFF;">Sooni</span><span class="text-cosmic">verse</span>
                            </span>
                            <div style="font-family: 'JetBrains Mono', 'Fira Code', monospace, Courier; font-size: 10.5px; font-weight: 700; letter-spacing: 3.5px; text-transform: uppercase; margin-top: 8px;">
                                <span style="color: #60EFFF; font-size: 8px; vertical-align: middle; margin-right: 6px;">●</span><span style="color: #60EFFF;">ADVANCED TECH UNIVERSE</span>
                            </div>
                        </td>
                    </tr>
                    
                    <!-- CONTENT -->
                    <tr>
                        <td style="padding: 40px 40px 30px 40px; background-color: #0F172A;">
                            {% block content %}{% endblock %}
                        </td>
                    </tr>
                    
                    <!-- FOOTER -->
                    <tr>
                        <td align="center" style="padding: 35px 40px 35px 40px; border-top: 1px solid #1E293B; font-size: 11px; color: #64748B; background-color: #0c1220; line-height: 1.5;">
                            <p style="margin: 0 0 8px 0; font-family: 'JetBrains Mono', monospace;">SOONIVERSE SECURE CHANNEL // AUTO-GENERATED DISPATCH</p>
                            <p style="margin: 0;">&copy; 2026 Sooniverse. Todos los derechos reservados. Cumplimiento RGPD y políticas de privacidad empresariales.</p>
                        </td>
                    </tr>
                    
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
