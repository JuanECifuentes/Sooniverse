<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 500 240" class="diagram w-full rounded-2xl bg-deep/60 p-2" style="border: 1px solid rgba(0, 255, 135, 0.25); font-family: 'Inter', system-ui, sans-serif;" role="img" aria-label="Diagrama de arquitectura Sooniverse: red privada aislada con perímetro punteado que cubre documentos, bases de datos y usuarios, conectados directamente al LLM privado dedicado con retorno seguro">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
            text {
                font-family: 'Inter', system-ui, sans-serif;
            }
        </style>
        <linearGradient id="solModelGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#00FF87"/>
            <stop offset="50%" stop-color="#60EFFF"/>
            <stop offset="100%" stop-color="#8A2BE2"/>
        </linearGradient>
        <linearGradient id="cosmicGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00FF87" />
            <stop offset="50%" stop-color="#60EFFF" />
            <stop offset="100%" stop-color="#8A2BE2" />
        </linearGradient>
        <linearGradient id="planetGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2563EB" />
            <stop offset="45%" stop-color="#4C1D95" />
            <stop offset="100%" stop-color="#1E1B4B" />
        </linearGradient>
        <filter id="neonGlow2" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
    </defs>

    <!-- PERÍMETRO EN RED PRIVADA: AMPLIO (CUBRE DOCUMENTOS, BDS, EQUIPO Y EL LLM PRIVADO) -->
    <g transform="translate(10, 10)">
        <!-- Fondo del perímetro -->
        <rect x="0" y="0" width="480" height="220" rx="16" fill="#00FF87" opacity="0.03"/>
        <!-- Borde punteado que delimita la red privada -->
        <rect x="0" y="0" width="480" height="220" rx="16" fill="none" stroke="#00FF87" stroke-width="1.6" stroke-dasharray="6 6" class="pulse-glow"/>
        
        <!-- Cabecera del perímetro privado -->
        <g transform="translate(16, 18)">
            <rect x="0" y="-8" width="9" height="8" rx="1.5" fill="none" stroke="#00FF87" stroke-width="1.3"/>
            <path d="M1.5,-8 a3,3 0 0 1 6,0" fill="none" stroke="#00FF87" stroke-width="1.3"/>
            <text x="15" y="-1" fill="#00FF87" font-size="9" font-weight="700" letter-spacing="1.2">SU PERÍMETRO · RED PRIVADA</text>
        </g>

        <!-- Badge de cumplimiento auditado -->
        <g transform="translate(390, 18)">
            <circle cx="0" cy="-4" r="6" fill="#00FF87" opacity="0.15"/>
            <path d="M-3,-4 l2,2 l4,-4" fill="none" stroke="#00FF87" stroke-width="1.4"/>
            <text x="9" y="-1" fill="#00FF87" font-size="8" font-weight="700">100% AISLADO</text>
        </g>
    </g>

    <!-- SUB-CARDS DEL ENTORNO EMPRESARIAL (DENTRO DEL PERÍMETRO) -->
    <g transform="translate(22, 28)">
        <text x="56" y="10" fill="#94A3B8" font-size="8" font-weight="700" text-anchor="middle">TU EMPRESA</text>
        
        <!-- Documentos -->
        <g transform="translate(0, 18)">
            <rect x="0" y="0" width="108" height="34" rx="8" fill="#0F172A" stroke="#00FF87" stroke-opacity="0.3" stroke-width="1"/>
            <rect x="10" y="9" width="12" height="15" rx="1.5" fill="#1E293B" stroke="#00FF87" stroke-width="1"/>
            <line x1="13" y1="13" x2="19" y2="13" stroke="#00FF87" stroke-width="0.8"/>
            <line x1="13" y1="17" x2="19" y2="17" stroke="#00FF87" stroke-width="0.8"/>
            <text x="63" y="21" fill="#E2E8F0" font-size="8.5" font-weight="500" text-anchor="middle">Documentos</text>
        </g>

        <!-- Bases de datos -->
        <g transform="translate(0, 60)">
            <rect x="0" y="0" width="108" height="34" rx="8" fill="#0F172A" stroke="#00FF87" stroke-opacity="0.3" stroke-width="1"/>
            <ellipse cx="16" cy="12" rx="6" ry="2.5" fill="#1E293B" stroke="#00FF87" stroke-width="1"/>
            <path d="M10,12 v8 a6,2.5 0 0 0 12,0 v-8" fill="#1E293B" stroke="#00FF87" stroke-width="1"/>
            <text x="63" y="21" fill="#E2E8F0" font-size="8.5" font-weight="500" text-anchor="middle">Bases de datos</text>
        </g>

        <!-- Usuarios / Apps -->
        <g transform="translate(0, 102)">
            <rect x="0" y="0" width="108" height="32" rx="8" fill="#0F172A" stroke="#60EFFF" stroke-opacity="0.3" stroke-width="1"/>
            <circle cx="16" cy="16" r="5" fill="#1E293B" stroke="#60EFFF" stroke-width="1"/>
            <text x="63" y="20" fill="#60EFFF" font-size="8" font-weight="500" text-anchor="middle">Tu equipo / Apps</text>
        </g>
    </g>

    <!-- 2 LÍNEAS DIRECTAS AL LLM PRIVADO (1 PARA DOCUMENTOS, 1 PARA BASES DE DATOS) -->
    <!-- Línea 1 (Documentos a LLM Privado) -->
    <path id="solDocDirect" d="M130,63 C185,63 215,74 265,74" fill="none" stroke="#00FF87" stroke-width="1.4" opacity="0.3"/>
    <path d="M130,63 C185,63 215,74 265,74" fill="none" stroke="#00FF87" stroke-width="1.4" stroke-dasharray="6 8" class="flow-dash"/>

    <!-- Línea 2 (Bases de datos a LLM Privado) -->
    <path id="solDbDirect" d="M130,105 C185,105 215,96 265,96" fill="none" stroke="#00FF87" stroke-width="1.4" opacity="0.3"/>
    <path d="M130,105 C185,105 215,96 265,96" fill="none" stroke="#00FF87" stroke-width="1.4" stroke-dasharray="6 8" class="flow-dash-slow"/>

    <!-- Icono animado de Documento viajando directamente al LLM Privado (suave a 5.0s) -->
    <g>
        <animateMotion dur="5.0s" repeatCount="indefinite" begin="0s">
            <mpath href="#solDocDirect" xlink:href="#solDocDirect"/>
        </animateMotion>
        <rect x="-4.5" y="-5.5" width="9" height="11" rx="1.5" fill="#0F172A" stroke="#00FF87" stroke-width="1.2"/>
        <line x1="-2.5" y1="-2" x2="2.5" y2="-2" stroke="#00FF87" stroke-width="0.8"/>
        <line x1="-2.5" y1="1" x2="2.5" y2="1" stroke="#00FF87" stroke-width="0.8"/>
    </g>

    <!-- Icono animado de Base de Datos viajando directamente al LLM Privado (suave a 5.0s) -->
    <g>
        <animateMotion dur="5.0s" repeatCount="indefinite" begin="1.0s">
            <mpath href="#solDbDirect" xlink:href="#solDbDirect"/>
        </animateMotion>
        <ellipse cx="0" cy="-3" rx="4.5" ry="1.8" fill="#0F172A" stroke="#00FF87" stroke-width="1.2"/>
        <path d="M-4.5,-3 L-4.5,3 A4.5,1.8 0 0 0 4.5,3 L4.5,-3" fill="#0F172A" stroke="#00FF87" stroke-width="1.2"/>
    </g>

    <!-- BLOQUE LLM PRIVADO DEDICADO (CON EL LOGO PLANETARIO OFICIAL SOONIVERSE) -->
    <g transform="translate(265, 46)">
        <rect x="0" y="0" width="205" height="84" rx="14" fill="url(#solModelGrad)" opacity="0.12"/>
        <rect x="0" y="0" width="205" height="84" rx="14" fill="none" stroke="url(#solModelGrad)" stroke-width="1.6"/>
        
        <!-- Logo Planetario Oficial Sooniverse -->
        <g transform="translate(102, 28) scale(0.18)">
            <!-- Anillos Traseros -->
            <g transform="rotate(-18)">
                <path d="M -68,0 A 68,19 0 0,1 68,0" fill="none" stroke="url(#cosmicGrad2)" stroke-width="2.5" opacity="0.35"/>
                <path d="M -92,0 A 92,26 0 0,1 92,0" fill="none" stroke="url(#cosmicGrad2)" stroke-width="11" opacity="0.4"/>
                <path d="M -92,0 A 92,26 0 0,1 92,0" fill="none" stroke="#60EFFF" stroke-width="2" opacity="0.6"/>
                <path d="M -114,0 A 114,32 0 0,1 114,0" fill="none" stroke="url(#cosmicGrad2)" stroke-width="3.5" opacity="0.3"/>
            </g>
            <!-- Cuerpo Celeste -->
            <circle cx="0" cy="0" r="46" fill="url(#planetGrad2)" stroke="#3B82F6" stroke-width="1.5" stroke-opacity="0.5"/>
            <path d="M -40,-22 Q 0,-10 40,-22" fill="none" stroke="#60EFFF" stroke-width="1.5" stroke-opacity="0.4"/>
            <path d="M -45,12 Q 0,26 45,12" fill="none" stroke="#00FF87" stroke-width="1.5" stroke-opacity="0.5"/>
            <!-- Anillos Delanteros -->
            <g transform="rotate(-18)">
                <path d="M 68,0 A 68,19 0 0,1 -68,0" fill="none" stroke="url(#cosmicGrad2)" stroke-width="2.5" stroke-linecap="round"/>
                <path d="M 92,0 A 92,26 0 0,1 -92,0" fill="none" stroke="url(#cosmicGrad2)" stroke-width="11" stroke-linecap="round"/>
                <path d="M 114,0 A 114,32 0 0,1 -114,0" fill="none" stroke="url(#cosmicGrad2)" stroke-width="3.5" stroke-linecap="round"/>
            </g>
            <!-- Nodos Activos -->
            <circle cx="-80" cy="-45" r="9" fill="#00FF87" filter="url(#neonGlow2)"/>
            <circle cx="104" cy="12" r="7.5" fill="#60EFFF" filter="url(#neonGlow2)"/>
            <circle cx="15" cy="58" r="8.5" fill="#8A2BE2" filter="url(#neonGlow2)"/>
        </g>

        <!-- Texto del LLM Privado -->
        <text x="102" y="58" fill="#FFFFFF" font-size="10" font-weight="700" text-anchor="middle">LLM Privado Dedicado</text>
        <text x="102" y="70" fill="#94A3B8" font-size="7.5" text-anchor="middle">Nodo en tu VPC</text>
        
        <circle cx="190" cy="16" r="3.5" fill="#00FF87" class="pulse-glow"/>
    </g>

    <!-- LÍNEA DE RESPUESTA: PUNTEADA, DIRECTA AL EQUIPO/APPS -->
    <path id="solRetLine" d="M367,130 C367,172 215,172 130,146" fill="none" stroke="#60EFFF" stroke-width="1.5" opacity="0.25"/>
    <path d="M367,130 C367,172 215,172 130,146" fill="none" stroke="#60EFFF" stroke-width="1.5" stroke-dasharray="4 8" class="flow-dash-ret"/>
    
    <!-- Partícula animada de respuesta regresando al equipo/apps (suave a 5.5s) -->
    <circle r="3.5" fill="#60EFFF">
        <animateMotion dur="5.5s" repeatCount="indefinite" begin="1.5s">
            <mpath href="#solRetLine" xlink:href="#solRetLine"/>
        </animateMotion>
    </circle>
    <g transform="translate(248, 166)">
        <rect x="-86" y="-6.5" width="172" height="13" rx="3.5" fill="#0A0F1D" stroke="#60EFFF" stroke-opacity="0.4" stroke-width="0.8" opacity="0.95"/>
        <text x="0" y="3" fill="#60EFFF" font-size="7" font-weight="700" text-anchor="middle">Respuesta segura (canal aislado) ➔</text>
    </g>

    <!-- BARRA INFERIOR DENTRO DEL PERÍMETRO: AUDITORÍA Y AISLAMIENTO -->
    <g transform="translate(24, 186)">
        <rect x="0" y="0" width="452" height="26" rx="6" fill="#0F172A" stroke="#00FF87" stroke-opacity="0.25" stroke-width="1"/>
        <circle cx="16" cy="13" r="3.5" fill="#00FF87" class="pulse-glow"/>
        <text x="28" y="16.5" fill="#94A3B8" font-size="8">Cero conexión con nubes públicas · 100% privado</text>
    </g>
</svg>
