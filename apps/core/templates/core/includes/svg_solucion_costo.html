<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 380 75" class="w-full h-auto" role="img" aria-label="Gráfico de costo fijo Sooniverse: el costo se mantiene horizontal y predecible sin importar el volumen de tokens procesados">
    <defs>
        <linearGradient id="purpleCostAreaGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#A855F7" stop-opacity="0.32"/>
            <stop offset="50%" stop-color="#8CBFF9" stop-opacity="0.12"/>
            <stop offset="100%" stop-color="#A855F7" stop-opacity="0.0"/>
        </linearGradient>
        <linearGradient id="purpleLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#A855F7"/>
            <stop offset="60%" stop-color="#B794F6"/>
            <stop offset="100%" stop-color="#8CBFF9"/>
        </linearGradient>
        <filter id="purpleGlowCost" x="-20%" y="-50%" width="140%" height="200%">
            <feGaussianBlur stdDeviation="3" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    <!-- Ejes y guías en Orbit Line v3.0 (#1F2940) -->
    <line x1="36" y1="8" x2="36" y2="58" stroke="#1F2940" stroke-width="1.2"/>
    <line x1="36" y1="58" x2="365" y2="58" stroke="#1F2940" stroke-width="1.2"/>
    <line x1="36" y1="18" x2="365" y2="18" stroke="#1F2940" stroke-width="0.8" stroke-dasharray="2 3" stroke-opacity="0.6"/>
    <line x1="36" y1="38" x2="365" y2="38" stroke="#1F2940" stroke-width="0.8" stroke-dasharray="2 3" stroke-opacity="0.6"/>
    
    <!-- Etiquetas de eje Y en Faint Slate (#7E8BA3) -->
    <text x="30" y="21" fill="#7E8BA3" font-size="7.5" text-anchor="end" font-family="JetBrains Mono, monospace">$$$</text>
    <text x="30" y="41" fill="#7E8BA3" font-size="7.5" text-anchor="end" font-family="JetBrains Mono, monospace">$$</text>
    <text x="30" y="59" fill="#7E8BA3" font-size="7.5" text-anchor="end" font-family="JetBrains Mono, monospace">$</text>
    
    <!-- Etiqueta de eje X -->
    <text x="365" y="70" fill="#7E8BA3" font-size="7.5" text-anchor="end" font-family="JetBrains Mono, monospace">Volumen de tokens / Uso ➔</text>
    
    <!-- Área sombreada bajo la línea en degradado morado-cielo -->
    <path d="M36,46 L345,46 L345,58 L36,58 Z" fill="url(#purpleCostAreaGrad)"/>

    <!-- Línea horizontal fija llamativa en vibrante degradado púrpura/violeta con resplandor -->
    <path id="solCostLine" d="M36,46 L345,46" fill="none" stroke="url(#purpleLineGrad)" stroke-width="2.5" filter="url(#purpleGlowCost)"/>
    
    <!-- Partícula animada en púrpura brillante sobre la línea fija -->
    <circle r="4" fill="#FFFFFF" stroke="#A855F7" stroke-width="1.5">
        <animateMotion dur="5.0s" repeatCount="indefinite">
            <mpath href="#solCostLine" xlink:href="#solCostLine"/>
        </animateMotion>
    </circle>
    
    <!-- Indicador y badge destacado de costo marginal cero en púrpura -->
    <circle cx="345" cy="46" r="4" fill="#A855F7" filter="url(#purpleGlowCost)"/>
    <rect x="238" y="28" width="112" height="15" rx="4" fill="#1A2238" stroke="#A855F7" stroke-width="1"/>
    <text x="294" y="39" fill="#D6E8FD" font-size="8" font-weight="700" text-anchor="middle" font-family="JetBrains Mono, monospace">● Costo marginal $0</text>
</svg>
