<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 380 75" class="w-full h-auto" role="img" aria-label="Gráfico de costo variable: el costo escala abruptamente a medida que aumenta el volumen de tokens">
    <defs>
        <linearGradient id="redCostAreaGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#EF4444" stop-opacity="0.30"/>
            <stop offset="100%" stop-color="#EF4444" stop-opacity="0.0"/>
        </linearGradient>
    </defs>
    <!-- Ejes y guías en sutil rojo/peligro sin bordes blancos -->
    <line x1="36" y1="8" x2="36" y2="58" stroke="rgba(239, 68, 68, 0.35)" stroke-width="1"/>
    <line x1="36" y1="58" x2="365" y2="58" stroke="rgba(239, 68, 68, 0.35)" stroke-width="1"/>
    <line x1="36" y1="18" x2="365" y2="18" stroke="rgba(239, 68, 68, 0.15)" stroke-width="0.8" stroke-dasharray="2 3"/>
    <line x1="36" y1="38" x2="365" y2="38" stroke="rgba(239, 68, 68, 0.15)" stroke-width="0.8" stroke-dasharray="2 3"/>
    
    <!-- Etiquetas de eje Y -->
    <text x="30" y="21" fill="#F87171" font-size="7.5" text-anchor="end" font-family="JetBrains Mono, monospace">$$$</text>
    <text x="30" y="41" fill="#F87171" font-size="7.5" text-anchor="end" font-family="JetBrains Mono, monospace">$$</text>
    <text x="30" y="59" fill="#F87171" font-size="7.5" text-anchor="end" font-family="JetBrains Mono, monospace">$</text>
    
    <!-- Etiqueta de eje X -->
    <text x="365" y="70" fill="#94A3B8" font-size="7.5" text-anchor="end" font-family="JetBrains Mono, monospace">Volumen de tokens / Uso ➔</text>
    
    <!-- Curva de costo exponencial ascendente -->
    <path id="prbCostCurve" d="M36,54 C130,52 230,42 345,14" fill="none" stroke="#EF4444" stroke-width="2" stroke-dasharray="6 8" class="flow-dash"/>
    <path d="M36,54 C130,52 230,42 345,14 L345,58 L36,58 Z" fill="url(#redCostAreaGrad)"/>
    
    <!-- Partícula animada sobre la curva (suave a 5.0s) -->
    <circle r="3.5" fill="#EF4444" class="pulse-glow-danger">
        <animateMotion dur="5.0s" repeatCount="indefinite">
            <mpath href="#prbCostCurve" xlink:href="#prbCostCurve"/>
        </animateMotion>
    </circle>
    
    <!-- Punto terminal de advertencia -->
    <circle cx="345" cy="14" r="3.5" fill="#EF4444"/>
    <text x="340" y="10" fill="#EF4444" font-size="8" font-weight="700" text-anchor="end" font-family="JetBrains Mono, monospace">▲ Factura sin control</text>
</svg>
