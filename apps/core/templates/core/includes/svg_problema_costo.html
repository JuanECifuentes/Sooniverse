<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 380 75" class="w-full h-auto" role="img" aria-label="Gráfico de costo variable: el costo escala abruptamente a medida que aumenta el volumen de tokens">
    <defs>
        <linearGradient id="slateCostAreaGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#F87171" stop-opacity="0.30"/>
            <stop offset="100%" stop-color="#F87171" stop-opacity="0.0"/>
        </linearGradient>
        <filter id="costRiskGlow" x="-20%" y="-50%" width="140%" height="200%">
            <feGaussianBlur stdDeviation="2.5" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    <!-- Ejes y guías -->
    <line x1="36" y1="8" x2="36" y2="58" stroke="#334155" stroke-width="1"></line>
    <line x1="36" y1="58" x2="365" y2="58" stroke="#334155" stroke-width="1"></line>
    <line x1="36" y1="18" x2="365" y2="18" stroke="#334155" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.4"></line>
    <line x1="36" y1="38" x2="365" y2="38" stroke="#334155" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.4"></line>
    
    <!-- Etiquetas de eje Y -->
    <text x="30" y="21" fill="#94A3B8" font-size="7.5" text-anchor="end" font-family="JetBrains Mono, monospace">$$$</text>
    <text x="30" y="41" fill="#94A3B8" font-size="7.5" text-anchor="end" font-family="JetBrains Mono, monospace">$$</text>
    <text x="30" y="59" fill="#94A3B8" font-size="7.5" text-anchor="end" font-family="JetBrains Mono, monospace">$</text>
    
    <!-- Etiqueta de eje X -->
    <text x="365" y="70" fill="#94A3B8" font-size="7.5" text-anchor="end" font-family="JetBrains Mono, monospace">Volumen de tokens / Uso ➔</text>
    
    <!-- Curva de costo ascendente en alerta coral/rojo (#F87171) con resplandor -->
    <path id="prbCostCurve" d="M36,54 C130,52 230,42 345,14" fill="none" stroke="#F87171" stroke-width="2.2" stroke-dasharray="6 8" class="flow-dash" filter="url(#costRiskGlow)"/>
    <path d="M36,54 C130,52 230,42 345,14 L345,58 L36,58 Z" fill="url(#slateCostAreaGrad)"/>
    
    <!-- Partícula animada sobre la curva -->
    <circle r="3.5" fill="#F87171" filter="url(#costRiskGlow)">
        <animateMotion dur="5.0s" repeatCount="indefinite">
            <mpath href="#prbCostCurve" xlink:href="#prbCostCurve"/>
        </animateMotion>
    </circle>
    
    <!-- Punto terminal e indicador -->
    <circle cx="345" cy="14" r="4" fill="#F87171" filter="url(#costRiskGlow)"/>
    <text x="340" y="10" fill="#F87171" font-size="8" font-weight="700" text-anchor="end" font-family="JetBrains Mono, monospace">▲ Factura sin control</text>
</svg>
