<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 380 75" class="w-full h-auto" role="img" aria-label="Gráfico de costo variable: el costo escala abruptamente a medida que aumenta el volumen de tokens">
    <defs>
        <linearGradient id="slateCostAreaGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#7E8BA3" stop-opacity="0.25"/>
            <stop offset="100%" stop-color="#7E8BA3" stop-opacity="0.0"/>
        </linearGradient>
    </defs>
    <!-- Ejes y guías en sutil orbit line v3.0 (#1F2940) -->
    <line x1="36" y1="8" x2="36" y2="58" stroke="#1F2940" stroke-width="1.2"/>
    <line x1="36" y1="58" x2="365" y2="58" stroke="#1F2940" stroke-width="1.2"/>
    <line x1="36" y1="18" x2="365" y2="18" stroke="#1F2940" stroke-width="0.8" stroke-dasharray="2 3" stroke-opacity="0.6"/>
    <line x1="36" y1="38" x2="365" y2="38" stroke="#1F2940" stroke-width="0.8" stroke-dasharray="2 3" stroke-opacity="0.6"/>
    
    <!-- Etiquetas de eje Y en neutro terciario v3.0 (#7E8BA3) -->
    <text x="30" y="21" fill="#7E8BA3" font-size="7.5" text-anchor="end" font-family="JetBrains Mono, monospace">$$$</text>
    <text x="30" y="41" fill="#7E8BA3" font-size="7.5" text-anchor="end" font-family="JetBrains Mono, monospace">$$</text>
    <text x="30" y="59" fill="#7E8BA3" font-size="7.5" text-anchor="end" font-family="JetBrains Mono, monospace">$</text>
    
    <!-- Etiqueta de eje X -->
    <text x="365" y="70" fill="#7E8BA3" font-size="7.5" text-anchor="end" font-family="JetBrains Mono, monospace">Volumen de tokens / Uso ➔</text>
    
    <!-- Curva de costo ascendente en neutro/slate (#7E8BA3) -->
    <path id="prbCostCurve" d="M36,54 C130,52 230,42 345,14" fill="none" stroke="#7E8BA3" stroke-width="2" stroke-dasharray="6 8" class="flow-dash"/>
    <path d="M36,54 C130,52 230,42 345,14 L345,58 L36,58 Z" fill="url(#slateCostAreaGrad)"/>
    
    <!-- Partícula animada sobre la curva -->
    <circle r="3.5" fill="#A0AEC6">
        <animateMotion dur="5.0s" repeatCount="indefinite">
            <mpath href="#prbCostCurve" xlink:href="#prbCostCurve"/>
        </animateMotion>
    </circle>
    
    <!-- Punto terminal -->
    <circle cx="345" cy="14" r="3.5" fill="#A0AEC6"/>
    <text x="340" y="10" fill="#A0AEC6" font-size="8" font-weight="700" text-anchor="end" font-family="JetBrains Mono, monospace">▲ Factura sin control</text>
</svg>
