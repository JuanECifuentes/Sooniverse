<header class="border-b border-border bg-surface/80 backdrop-blur-xl sticky top-0 z-30 shrink-0">
  <div class="mx-auto px-4 sm:px-6 py-3 sm:py-4 flex items-center justify-between gap-3">
    <div class="flex items-center gap-2 sm:gap-3 min-w-0">
      <button type="button" onclick="toggleMobileSidebar()" class="md:hidden text-slate hover:text-white p-1.5 -ml-1 rounded-lg border border-border/60 bg-surface/60 focus:outline-none flex-shrink-0" aria-label="Abrir menú de navegación">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <span class="font-extrabold text-lg sm:text-xl tracking-tight select-none truncate">
        <span class="text-white">Sooni</span><span class="text-cosmic">verse</span>
      </span>
      <span class="hidden sm:inline-block font-mono text-[10px] uppercase tracking-brand text-neon border-l border-border pl-3 flex-shrink-0">Internal CRM</span>
    </div>
    <div class="flex items-center gap-2 sm:gap-3 flex-shrink-0">
      <a href="/admin/" class="btn-secondary px-2.5 sm:px-4 py-1.5 sm:py-2 rounded-lg text-[10px] sm:text-xs font-bold text-white uppercase tracking-wide">
        <span class="sm:hidden">Admin</span>
        <span class="hidden sm:inline">Admin Django</span>
      </a>
      <form method="post" action="{% url 'core:logout' %}" class="inline">
        {% csrf_token %}
        <button type="submit" class="btn-primary px-2.5 sm:px-4 py-1.5 sm:py-2 rounded-lg text-[10px] sm:text-xs font-bold text-deep uppercase tracking-wide">
          <span class="sm:hidden">Salir</span>
          <span class="hidden sm:inline">Cerrar Sesión</span>
        </button>
      </form>
    </div>
  </div>
</header>
