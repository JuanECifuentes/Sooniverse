{% load static %}
<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Sooniverse | Diagnóstico Técnico{% endblock %}</title>
    <link rel="icon" type="image/png" sizes="192x192" href="{% static 'icons/icon-192x192.png' %}">
    <link rel="apple-touch-icon" href="{% static 'icons/icon-192x192.png' %}">
    <meta name="robots" content="{% block robots %}noindex, nofollow{% endblock %}">

    <link href="{% static 'css/dist/tailwind.css' %}" rel="stylesheet">
    <link href="{% static 'css/sooniverse-v4.css' %}?v=4.0" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

    {% block extra_head %}{% endblock %}

    <style>
        html { scroll-behavior: smooth; background-color: var(--sv-bg-base); }
        body { font-family: var(--sv-font-sans); background-color: var(--sv-bg-base); color: #FFFFFF; }
        input:disabled, select:disabled, textarea:disabled { opacity: 0.55; cursor: not-allowed; }
    </style>
</head>
<body class="min-h-screen bg-[#070A12] text-white antialiased">
    <div class="noise-overlay"></div>
    <div class="cosmic-bg" aria-hidden="true"></div>

    <header class="border-b border-[#1E293B] bg-[#0F172A]/85 backdrop-blur-xl sticky top-0 z-30 transition-all">
        <div class="max-w-7xl mx-auto px-6 py-3.5 lg:px-8 flex items-center justify-between">
            <a href="/" class="flex items-center gap-2 group">
                <img src="{% static 'logos_v1/animado.svg' %}" alt="Sooniverse" class="h-8 w-auto">
            </a>
            <span class="tag-pill tag-pill-sky">{% block header_label %}Diagnóstico Técnico{% endblock %}</span>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 lg:px-8">
        {% block content %}{% endblock %}
    </main>

    {% block extra_scripts %}{% endblock %}
</body>
</html>
