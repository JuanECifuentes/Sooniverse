<!-- ═══════════════════════════════════════════════════ -->
<!-- MODAL: Horarios del Barbero                        -->
<!-- ═══════════════════════════════════════════════════ -->
<div id="modal-schedule"
    class="hidden fixed inset-0 z-[100] flex items-start justify-center p-4 bg-black/60 overflow-y-auto">
    <div class="w-full max-w-2xl bg-neutral-900 border border-neutral-800 rounded-xl p-6 space-y-4 my-8">
        <div class="flex items-center justify-between">
            <h3 class="font-heading font-bold text-lg text-white">Horario Semanal</h3>
            <button onclick="closeScheduleModal()" class="text-neutral-400 hover:text-white transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>
        <input type="hidden" id="schedule-barber-id" value="">

        <!-- Global time settings: Lunch, Buffer & Opening Interval -->
        <div class="card space-y-3">
            <h4 class="font-heading font-bold text-sm text-white flex items-center gap-2">
                <svg class="w-4 h-4 text-brand" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
                Configuración de Tiempo
            </h4>
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                <div class="flex flex-col justify-between h-full">
                    <label class="text-xs text-neutral-400 mb-1 block">Inicio almuerzo</label>
                    <input id="sched-lunch-start" type="text" placeholder="--:--"
                        class="flatpickr-time-input w-full px-4 py-3 bg-neutral-800 border border-neutral-700 rounded-lg text-white text-sm focus:ring-2 focus:ring-brand focus:border-brand transition-colors">
                </div>
                <div class="flex flex-col justify-between h-full">
                    <label class="text-xs text-neutral-400 mb-1 block">Fin almuerzo</label>
                    <input id="sched-lunch-end" type="text" placeholder="--:--"
                        class="flatpickr-time-input w-full px-4 py-3 bg-neutral-800 border border-neutral-700 rounded-lg text-white text-sm focus:ring-2 focus:ring-brand focus:border-brand transition-colors">
                </div>
                <div class="flex flex-col justify-between h-full">
                    <label class="text-xs text-neutral-400 mb-1 block">Buffer entre citas (min)</label>
                    <input id="sched-buffer" type="number" min="0" value="0"
                        class="w-full px-4 py-3 bg-neutral-800 border border-neutral-700 rounded-lg text-white text-sm focus:ring-2 focus:ring-brand focus:border-brand transition-colors">
                </div>
                <div class="flex flex-col justify-between h-full">
                    <label class="text-xs text-neutral-400 mb-1 block">Ventana de apertura (días)</label>
                    <input id="sched-intervalo" type="number" min="1" max="365" value="15"
                        class="w-full px-4 py-3 bg-neutral-800 border border-neutral-700 rounded-lg text-white text-sm focus:ring-2 focus:ring-brand focus:border-brand transition-colors">
                </div>
            </div>
        </div>

        <p class="text-xs text-neutral-400">Marca los días que trabaja y establece sus horas. Los días sin marcar se
            consideran libres.</p>

        <!-- Weekly schedule (accordion style) -->
        <div class="space-y-2 max-h-[40vh] overflow-y-auto pr-1" id="schedule-days">
            <!-- Generated by JS -->
        </div>

        <button onclick="saveSchedule()" class="btn-action-primary btn-primary w-full border border-neutral-700 px-4 py-2 rounded-lg transition-all shadow-sm" id="btn-save-schedule"><span>Guardar Horario</span></button>

        <!-- ── Excepciones / Permisos ── -->
        <div class="border-t border-neutral-800 pt-4 mt-4">
            <div class="flex items-center justify-between mb-3">
                <h4 class="font-heading font-bold text-sm text-white">Excepciones y Permisos</h4>
                <button onclick="toggleExceptionForm()"
                    class="btn-action-primary text-xs flex items-center gap-1 border border-neutral-700 px-4 py-2 rounded-lg transition-all shadow-sm text-neutral-300">
                    <svg class="w-4 h-4" style="position:relative;z-index:1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                    </svg>
                    <span>Añadir excepción</span>
                </button>
            </div>

            <!-- Exception form (hidden by default) -->
            <div id="exception-form" class="hidden card mb-3 space-y-3">
                <!-- Header with close button -->
                <div class="flex items-center justify-between">
                    <h5 class="font-heading font-bold text-sm text-white">Nueva Excepción</h5>
                    <button onclick="closeExceptionForm()" class="text-neutral-400 hover:text-white transition-colors" data-tooltip="Cerrar">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </button>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-xs text-neutral-400 mb-1 block">Tipo</label>
                        <select id="exc-type"
                            class="w-full px-4 py-3 bg-neutral-800 border border-neutral-700 rounded-lg text-white text-sm focus:ring-2 focus:ring-brand focus:border-brand transition-colors">
                            <option value="vacation">Vacaciones</option>
                            <option value="sick_leave">Permiso médico</option>
                            <option value="personal">Permiso personal</option>
                            <option value="lunch">Almuerzo</option>
                            <option value="break">Descanso</option>
                            <option value="other">Otro</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-xs text-neutral-400 mb-1 block">Descripción</label>
                        <input id="exc-desc" type="text" placeholder="Motivo"
                            class="exc-field w-full px-4 py-3 bg-neutral-800 border border-neutral-700 rounded-lg text-white text-sm placeholder-neutral-500 focus:ring-2 focus:ring-brand focus:border-brand transition-colors">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-xs text-neutral-400 mb-1 block">Inicio *</label>
                        <input id="exc-start" type="text" placeholder="Seleccionar fecha y hora"
                            class="exc-field exc-required flatpickr-datetime-input w-full px-4 py-3 bg-neutral-800 border border-neutral-700 rounded-lg text-white text-sm focus:ring-2 focus:ring-brand focus:border-brand transition-colors">
                    </div>
                    <div>
                        <label class="text-xs text-neutral-400 mb-1 block">Fin *</label>
                        <input id="exc-end" type="text" placeholder="Seleccionar fecha y hora"
                            class="exc-field exc-required flatpickr-datetime-input w-full px-4 py-3 bg-neutral-800 border border-neutral-700 rounded-lg text-white text-sm focus:ring-2 focus:ring-brand focus:border-brand transition-colors">
                    </div>
                </div>
                <!-- Validation message -->
                <p id="exc-validation-msg" class="text-sm text-brand hidden">Por favor, rellena todos los campos obligatorios.</p>
                <label class="flex items-center gap-2 text-sm text-neutral-300">
                    <input id="exc-recurring" type="checkbox"
                        class="rounded border-neutral-600 text-brand focus:ring-brand bg-neutral-700">
                    Recurrente (se repite semanalmente)
                </label>
                <div class="flex gap-3">
                    <button onclick="closeExceptionForm()"
                        class="flex-1 text-sm font-medium px-4 py-2 rounded-lg border border-neutral-700 text-neutral-400 hover:text-neutral-200 hover:border-neutral-500 transition-all">Cancelar</button>
                    <button id="btn-create-exception" onclick="createException()" disabled
                        class="btn-action-primary btn-primary flex-1 text-sm opacity-50 cursor-not-allowed border border-neutral-700 px-4 py-2 rounded-lg transition-all shadow-sm"><span>Registrar permisos</span></button>
                </div>
            </div>

            <!-- Exceptions list -->
            <div id="exceptions-list" class="space-y-2 pr-1">
                <!-- Populated by JS -->
            </div>
        </div>
    </div>
</div>
